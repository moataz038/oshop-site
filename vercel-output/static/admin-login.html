<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FDE3D0" />
    <title>دخول الموظفين | Oshop</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fff8f3; color: #292524; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #ead8cb; border-radius: 20px; background: white; box-shadow: 0 12px 36px #53250f12; }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { color: #6b625c; line-height: 1.7; }
      label { display: block; margin: 20px 0 8px; font-weight: 600; }
      input { width: 100%; min-height: 48px; border: 1px solid #cfc4bc; border-radius: 10px; padding: 10px 12px; font: inherit; }
      button { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 10px; background: #a34822; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 1.7em; margin-bottom: 0; }
      #status[data-error="true"] { color: #a32121; }
    </style>
  </head>
  <body>
    <main>
      <h1>دخول الموظفين</h1>
      <p>هذه صفحة دخول خاصة بلوحة Oshop. استخدم كلمة مرور الإدارة المحفوظة في إعدادات النشر.</p>
      <form id="login-form" autocomplete="on">
        <label for="password">كلمة مرور الإدارة</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="32" autofocus />
        <button id="submit" type="submit">تسجيل الدخول</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script defer src="./admin-login.js"></script>
  </body>
</html>
